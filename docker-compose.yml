services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: wallet
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -e;
        timeout 120 sh -c
        'until pg_isready -h postgres -U wallet -d wallet; do sleep 1; done';
        psql -h postgres -U wallet -d wallet -v ON_ERROR_STOP=1
        -f /migrations/000001_bootstrap.up.sql;
        psql -h postgres -U wallet -d wallet -v ON_ERROR_STOP=1
        -f /migrations/000002_transaction_reversal_claim.up.sql;
        psql -h postgres -U wallet -d wallet -v ON_ERROR_STOP=1
        -f /migrations/000003_pending_reference_retry.up.sql
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --http-port=8080 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8081:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c \"exec 3<>/dev/tcp/127.0.0.1/8080\" >/dev/null 2>&1 || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./deploy/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  localstack:
    image: localstack/localstack:3.6
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/compose/localstack-init.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "awslocal sqs list-queues >/dev/null"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable

      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo

      OIDC_ISSUER: http://localhost:8081/realms/wallet
      OIDC_AUDIENCE: wallet-api

      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

      SQS_VISIBILITY_TIMEOUT: ${SQS_VISIBILITY_TIMEOUT:-30}
      SQS_WAIT_TIME_SECONDS: ${SQS_WAIT_TIME_SECONDS:-1}

      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_LEASE_DURATION: ${OUTBOX_LEASE_DURATION:-30s}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}

      REFERENCE_BATCH_SIZE: ${REFERENCE_BATCH_SIZE:-100}
      REFERENCE_MAX_ATTEMPTS: ${REFERENCE_MAX_ATTEMPTS:-8}
      REFERENCE_BASE_BACKOFF: ${REFERENCE_BASE_BACKOFF:-1s}
      REFERENCE_MAX_BACKOFF: ${REFERENCE_MAX_BACKOFF:-1h}
      REFERENCE_TTL: ${REFERENCE_TTL:-24h}

    ports:
      - "8080:8080"

    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  worker:
    build: .
    entrypoint: ["/app/worker"]

    extra_hosts:
      - "localhost:host-gateway"

    environment:
      DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable

      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo

      OIDC_ISSUER: http://localhost:8081/realms/wallet
      OIDC_AUDIENCE: wallet-api

      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

      SQS_VISIBILITY_TIMEOUT: ${SQS_VISIBILITY_TIMEOUT:-30}
      SQS_WAIT_TIME_SECONDS: ${SQS_WAIT_TIME_SECONDS:-1}

      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_LEASE_DURATION: ${OUTBOX_LEASE_DURATION:-30s}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}

      REFERENCE_BATCH_SIZE: ${REFERENCE_BATCH_SIZE:-100}
      REFERENCE_MAX_ATTEMPTS: ${REFERENCE_MAX_ATTEMPTS:-8}
      REFERENCE_BASE_BACKOFF: ${REFERENCE_BASE_BACKOFF:-1s}
      REFERENCE_MAX_BACKOFF: ${REFERENCE_MAX_BACKOFF:-1h}
      REFERENCE_TTL: ${REFERENCE_TTL:-24h}

    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  postgres_data:
  localstack_data: